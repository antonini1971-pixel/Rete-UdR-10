<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mappa Rete UdR 10</title>
  <meta name="description" content="Mappa interattiva delle linee, fermate e orari della Rete UdR 10 (Autolinee Troiani).">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10Zm3.5 1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3ZM18 11H6V6h12v5Z"/></svg>
      </span>
      <div>
        <h1>Rete UdR 10</h1>
        <p class="sub" id="agency">Mappa interattiva di linee, fermate e orari</p>
      </div>
    </div>
    <div class="day-switch" role="radiogroup" aria-label="Tipo di giorno" id="daySwitch"></div>
  </header>

  <main class="layout">
    <aside class="panel" id="panel">
      <button class="grip" id="grip" aria-label="Espandi/riduci pannello"><span></span></button>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="linee" class="active">Linee</button>
        <button role="tab" data-tab="fermate">Fermate</button>
        <button role="tab" data-tab="info">Rete</button>
      </nav>

      <section class="tab-body" data-body="linee">
        <div class="search">
          <input type="search" id="lineSearch" placeholder="Cerca linea o comune…" autocomplete="off">
        </div>
        <div class="chips" id="comuneChips"></div>
        <div id="lineList" class="list"></div>
      </section>

      <section class="tab-body hidden" data-body="fermate">
        <div class="search">
          <input type="search" id="stopSearch" placeholder="Cerca fermata (nome o codice)…" autocomplete="off">
          <button class="icon-btn" id="locateBtn" title="Fermate vicino a me" aria-label="Fermate vicino a me">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06ZM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>
          </button>
        </div>
        <div id="stopList" class="list"></div>
      </section>

      <section class="tab-body hidden" data-body="info">
        <div id="netInfo"></div>
      </section>

      <section class="detail hidden" id="detail"></section>
    </aside>

    <div class="map-wrap">
      <div id="map" aria-label="Mappa"></div>
      <div class="map-tools">
        <label class="toggle"><input type="checkbox" id="showStops" checked> Fermate</label>
        <label class="toggle"><input type="checkbox" id="freqMode"> Spessore = n. corse</label>
      </div>
      <div class="legend hidden" id="freqLegend">
        <span>Corse/giorno</span>
        <div class="bar"></div>
        <div class="ticks"><span>1</span><span id="freqMax">—</span></div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/rete.js"></script>
  <script src="app.js"></script>
</body>
</html>
